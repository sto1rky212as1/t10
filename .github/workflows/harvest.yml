name: Shadow_Harvest
on:
  schedule:
    - cron: '5 * * * *'        # يُنفذ كل ساعة عند الدقيقة 5
  workflow_dispatch:           # يسمح بالتشغيل اليدوي من تبويب Actions

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v3
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: pip install requests
    - name: Run Secret Harvester
      run: python harvester.py
